# DKMS rebuilds calcomp_drv.ko automatically for every new kernel.
# Installed by packaging/install.sh into /usr/src/calcomp_drv-<version>/.
PACKAGE_NAME="calcomp_drv"
PACKAGE_VERSION="0.1"
BUILT_MODULE_NAME[0]="calcomp_drv"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
